name: Test AWS CLI v2 installation with custom directories
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl zip
      - name: Create custom install directory
        run: |
          sudo mkdir -p /tmp/custom-install
          sudo chmod 777 /tmp/custom-install
      - name: Install self-contained fake wget
        run: |
          # Install the self-contained fake wget at /usr/local/bin/wget
          # It handles --spider (returns HTTP/1.1 200 OK) and -O FILE URL (creates fake zip)
          # /usr/local/bin is in sudo's secure_path so it will be found under sudo
          sudo cp "$GITHUB_WORKSPACE/tests/fixtures/fake-wget-selfcontained.sh" /usr/local/bin/wget
          sudo chmod +x /usr/local/bin/wget
          echo "Installed fake wget at: $(which wget)"
      - id: action
        uses: .
        with:
          version: "2"
          # Use default bindir (/usr/local/bin) so aws is in PATH for entrypoint's test_aws_cli()
          bindir: "/usr/local/bin"
          installrootdir: "/tmp/custom-install"
          verbose: "false"
      - name: Assert version output contains aws-cli
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "aws-cli/"; then
            echo "FAIL: expected output to contain 'aws-cli/' but got: $ACTUAL"
            exit 1
          fi
          echo "PASS: version output contains aws-cli/"
      - name: Assert aws binary is available in default bindir
        run: |
          if [ ! -f "/usr/local/bin/aws" ] && [ ! -L "/usr/local/bin/aws" ]; then
            echo "FAIL: aws binary not found in /usr/local/bin"
            ls -la /usr/local/bin/ | grep aws || true
            exit 1
          fi
          echo "PASS: aws binary found in /usr/local/bin"
      - name: Assert aws-cli installed in custom installrootdir
        run: |
          if [ ! -d "/tmp/custom-install/aws-cli" ]; then
            echo "FAIL: aws-cli directory not found in custom installrootdir /tmp/custom-install"
            ls -la /tmp/custom-install/ || true
            exit 1
          fi
          echo "PASS: aws-cli directory found in custom installrootdir /tmp/custom-install"
