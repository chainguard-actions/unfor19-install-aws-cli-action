name: Test specific version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 2.0.30
      - name: Assert version output contains aws-cli
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual: $ACTUAL"
          if [[ "$ACTUAL" != aws-cli/* ]]; then
            echo "FAIL: expected version output to start with 'aws-cli/', got: $ACTUAL"
            exit 1
          fi
          echo "PASS: version output is $ACTUAL"
      - name: Assert specific version 2.0.30 is installed
        run: |
          VERSION=$(aws --version 2>&1)
          echo "aws --version: $VERSION"
          if [[ "$VERSION" != aws-cli/2.0.30* ]]; then
            echo "FAIL: expected AWS CLI 2.0.30, got: $VERSION"
            exit 1
          fi
          echo "PASS: AWS CLI 2.0.30 installed"
