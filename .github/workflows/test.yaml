name: test

on:
  push:
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions: {}

jobs:
  dispatch_test_action:
    name: Dispatch Test Action
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # main
      - name: Workflow Dispatch Status
        uses: unfor19/hero-action@f2d4009031e4930710f99f95f0e02fff70e5c893 # master
        with:
          action: "dispatch-status"
          src_repository: ${{ github.repository }}
          src_workflow_name: ${{ github.workflow }}
          src_sha: ${{ github.sha }}
          target_repository: ${{ github.repository }}-test
          target_workflow_name: "test-action.yml"
          gh_token: ${{ secrets.GH_TOKEN }} # scope: repo + workflow

  test_dirs:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - TEST_NAME: "ROOTDIR v2"
            AWS_CLI_VERSION: "2"
            ROOTDIR: "/tmp"
          - TEST_NAME: "WORKDIR v2"
            AWS_CLI_VERSION: "2"
            WORKDIR: "/tmp/unfor19-awscli"            
          - TEST_NAME: "ROOTDIR v1"
            AWS_CLI_VERSION: "1"
            ROOTDIR: "/tmp"
          - TEST_NAME: "WORKDIR v1"
            AWS_CLI_VERSION: "1"
            WORKDIR: "/tmp/unfor19-awscli" 
          - TEST_NAME: "BINDIR v2"
            AWS_CLI_VERSION: "2"
            BINDIR: "/tmp/aws/bin"
          - TEST_NAME: "INSTALLROOTDIR v2"
            AWS_CLI_VERSION: "2"
            INSTALLROOTDIR: "/tmp/aws"  
    name: Test ${{ matrix.TEST_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # main
      - name: Test On Runner
        env:
          AWS_CLI_VERSION: "${{ matrix.AWS_CLI_VERSION}}"
          AWS_CLI_ARCH: "${{ matrix.AWS_CLI_ARCH }}"
          ROOTDIR: "${{ matrix.ROOTDIR }}" 
          WORKDIR: "${{ matrix.WORKDIR }}"
          BINDIR: "${{ matrix.BINDIR }}"
          INSTALLROOTDIR: "${{ matrix.INSTALLROOTDIR }}"
        run: |
          sudo --preserve-env ./entrypoint.sh

  test_x86:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - TEST_NAME: "Latest v2"
            AWS_CLI_VERSION: "2"
          - TEST_NAME: "Specific v2"
            AWS_CLI_VERSION: "2.0.30"
          - TEST_NAME: "Latest v1"
            AWS_CLI_VERSION: "1"
          - TEST_NAME: "Specific v1"
            AWS_CLI_VERSION: "1.41.8"
          - TEST_NAME: "No Input"
    name: Test amd64 ${{ matrix.TEST_NAME }} ${{ matrix.AWS_CLI_VERSION}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # main
      - name: Test On Runner
        env:
          AWS_CLI_VERSION: "${{ matrix.AWS_CLI_VERSION}}"
          AWS_CLI_ARCH: "x86"
        run: |
          sudo --preserve-env ./entrypoint.sh

  test_x64:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - TEST_NAME: "Latest v2"
            AWS_CLI_VERSION: "2"
          - TEST_NAME: "Specific v2"
            AWS_CLI_VERSION: "2.0.30"
          - TEST_NAME: "Latest v1"
            AWS_CLI_VERSION: "1"
          - TEST_NAME: "Specific v1"
            AWS_CLI_VERSION: "1.41.8"
          - TEST_NAME: "No Input"
    name: Test amd64 ${{ matrix.TEST_NAME }} ${{ matrix.AWS_CLI_VERSION}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # main
      - name: Test On Runner
        env:
          AWS_CLI_VERSION: "${{ matrix.AWS_CLI_VERSION}}"
          AWS_CLI_ARCH: "x64"
        run: |
          sudo --preserve-env ./entrypoint.sh

  test_amd64:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - TEST_NAME: "Latest v2"
            AWS_CLI_VERSION: "2"
          - TEST_NAME: "Specific v2"
            AWS_CLI_VERSION: "2.0.30"
          - TEST_NAME: "Latest v1"
            AWS_CLI_VERSION: "1"
          - TEST_NAME: "Specific v1"
            AWS_CLI_VERSION: "1.41.8"
          - TEST_NAME: "No Input"
    name: Test amd64 ${{ matrix.TEST_NAME }} ${{ matrix.AWS_CLI_VERSION}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # main
      - name: Test On Runner
        env:
          AWS_CLI_VERSION: "${{ matrix.AWS_CLI_VERSION}}"
          AWS_CLI_ARCH: "${{ matrix.AWS_CLI_ARCH }}"
        run: |
          sudo --preserve-env ./entrypoint.sh

  test_arm:
    # Supports only v2+
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - TEST_NAME: "Latest v2"
            AWS_CLI_VERSION: "2"
          - TEST_NAME: "Specific v2"
            AWS_CLI_VERSION: "2.0.30"
    name: Test arm64 ${{ matrix.TEST_NAME }} ${{ matrix.AWS_CLI_VERSION}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # main
      - name: Set up QEMU
        uses: docker/setup-qemu-action@288220e341e5c445ddb6d73e19a57a9012ceca88 # master
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@5b9cf3909b54a280b6df6eee035755eb1f2fd611 # master
        with:
          install: true
      - name: Prepare
        id: prep
        env:
          AWS_CLI_VERSION: ${{ matrix.AWS_CLI_VERSION }}
        run: |
          IMAGE="install-aws-cli"
          SAFE_VERSION=$(printf '%s' "${AWS_CLI_VERSION}" | tr -d '\n\r')
          TAG=$(echo "$GITHUB_SHA" | head -c7)-"${SAFE_VERSION}"
          safe_tag=$(printf '%s' "${IMAGE}:${TAG}" | tr -d '\n\r')
          echo "tagged_image=${safe_tag}" >> "${GITHUB_OUTPUT}"
      - name: Cache Docker layers
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # main
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.AWS_CLI_VERSION }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.AWS_CLI_VERSION }}-
      - name: Build Docker Image
        uses: docker/build-push-action@cb941d0b895b09c17fa011d41c411b33c752cf28 # master
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          push: false
          load: true
          tags: ${{ steps.prep.outputs.tagged_image }}
          cache-from: type=local,src=/tmp/.buildx-cache
          platforms: arm64
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache-new
      - name: Test In Docker
        env:
          AWS_CLI_VERSION: "${{ matrix.AWS_CLI_VERSION}}"
          AWS_CLI_ARCH: "arm"
          DOCKER_TAG: "install-aws-cli-action"
          TAGGED_IMAGE: ${{ steps.prep.outputs.tagged_image }}
        run: |
          docker run --rm -e AWS_CLI_VERSION -e AWS_CLI_ARCH "$TAGGED_IMAGE"
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  test_arm64:
    # Supports only v2+
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - TEST_NAME: "Latest v2"
            AWS_CLI_VERSION: "2"
          - TEST_NAME: "Specific v2"
            AWS_CLI_VERSION: "2.0.30"
    name: Test arm64 ${{ matrix.TEST_NAME }} ${{ matrix.AWS_CLI_VERSION}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # main
      - name: Set up QEMU
        uses: docker/setup-qemu-action@288220e341e5c445ddb6d73e19a57a9012ceca88 # master
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@5b9cf3909b54a280b6df6eee035755eb1f2fd611 # master
        with:
          install: true
      - name: Prepare
        id: prep
        env:
          AWS_CLI_VERSION: ${{ matrix.AWS_CLI_VERSION }}
        run: |
          IMAGE="install-aws-cli"
          SAFE_VERSION=$(printf '%s' "${AWS_CLI_VERSION}" | tr -d '\n\r')
          TAG=$(echo "$GITHUB_SHA" | head -c7)-"${SAFE_VERSION}"
          safe_tag=$(printf '%s' "${IMAGE}:${TAG}" | tr -d '\n\r')
          echo "tagged_image=${safe_tag}" >> "${GITHUB_OUTPUT}"
      - name: Cache Docker layers
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # main
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.AWS_CLI_VERSION }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.AWS_CLI_VERSION }}-
      - name: Build Docker Image
        uses: docker/build-push-action@cb941d0b895b09c17fa011d41c411b33c752cf28 # master
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          push: false
          load: true
          tags: ${{ steps.prep.outputs.tagged_image }}
          cache-from: type=local,src=/tmp/.buildx-cache
          platforms: arm64
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache-new
      - name: Test In Docker
        env:
          AWS_CLI_VERSION: "${{ matrix.AWS_CLI_VERSION}}"
          AWS_CLI_ARCH: "arm64"
          DOCKER_TAG: "install-aws-cli-action"
          TAGGED_IMAGE: ${{ steps.prep.outputs.tagged_image }}
        run: |
          docker run --rm -e AWS_CLI_VERSION -e AWS_CLI_ARCH "$TAGGED_IMAGE"
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
