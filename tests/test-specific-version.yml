name: Test specific AWS CLI v2 version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl zip
      - name: Install self-contained fake wget
        run: |
          # Install the self-contained fake wget at /usr/local/bin/wget
          # It handles --spider (returns HTTP/1.1 200 OK) and -O FILE URL (creates fake zip)
          # /usr/local/bin is in sudo's secure_path so it will be found under sudo
          sudo cp "$GITHUB_WORKSPACE/tests/fixtures/fake-wget-selfcontained.sh" /usr/local/bin/wget
          sudo chmod +x /usr/local/bin/wget
          echo "Installed fake wget at: $(which wget)"
      - id: action
        uses: .
        with:
          version: "2.13.0"
          verbose: "false"
      - name: Assert version output contains aws-cli/2.13.0
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "aws-cli/2.13.0"; then
            echo "FAIL: expected output to contain 'aws-cli/2.13.0' but got: $ACTUAL"
            exit 1
          fi
          echo "PASS: version output contains aws-cli/2.13.0"
      - name: Assert aws binary is available
        run: |
          if ! command -v aws &>/dev/null; then
            echo "FAIL: aws command not found in PATH"
            exit 1
          fi
          echo "PASS: aws command found at $(which aws)"
